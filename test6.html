<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Тест deeplink Сбер</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { display: block; margin: 10px 0; padding: 10px; width: 100%; }
    </style>
</head>
<body>
    <h1>Тестирование deeplink для Сбера</h1>

    <div>
        <h2>Без параметров (проверка работы схем)</h2>
        <button onclick="openLink('sberbankonline://transfers/overseas')">sberbankonline://transfers/overseas</button>
        <button onclick="openLink('sbolonline://transfers/overseas')">sbolonline://transfers/overseas</button>
        <button onclick="openLink('onlineappmobile://sbolonline/transfers/overseas')">onlineappmobile://sbolonline/transfers/overseas</button>
        <button onclick="openLink('intent://ru.sberbankmobile/transfers/overseas#Intent;scheme=sberbankonline;package=ru.sberbankmobile;end')">Intent для Android</button>
        <button onclick="openLink('android-app://ru.sberbankmobile/transfers/overseas')">android-app://ru.sberbankmobile/transfers/overseas</button>
    </div>

    <div>
        <h2>С параметрами (UZ)</h2>
        <button onclick="openLink('sberbankonline://transfers/overseas?recipient%3Acountry=UZ')">sberbankonline с страной UZ</button>
        <button onclick="openLink('sbolonline://transfers/overseas?recipient%3Acountry=UZ')">sbolonline с страной UZ</button>
        <button onclick="openLink('intent://ru.sberbankmobile/transfers/overseas?recipient%3Acountry=UZ#Intent;scheme=sberbankonline;package=ru.sberbankmobile;end')">Intent с страной UZ</button>
    </div>

    <div>
        <h2>С параметрами (UZ, телефон, банк, сумма)</h2>
        <button onclick="openLink('sberbankonline://transfers/overseas?recipient%3Acountry=UZ&recipient%3AphoneNumber=%2B998381916876&recipient%3Abank=ASACUZ22&requisite%3AtransferAmount=1000')">Полный набор параметров</button>
    </div>

    <div id="message" style="margin-top: 20px; color: green;"></div>

    <script>
        function openLink(link) {
            document.getElementById('message').textContent = 'Пытаемся открыть: ' + link;
            window.location.href = link;
            
            // Если приложение не установлено, через 2 секунды покажем сообщение
            setTimeout(function() {
                document.getElementById('message').textContent += ' \n Возможно, приложение не установлено.';
            }, 2000);
        }
    </script>

    <p>Если приложение не открывается, убедитесь, что оно установлено. <a href="https://www.sberbank.com/ru/person/dist_services/sberbankonline">Ссылка на приложение СберБанк</a></p>
</body>
</html>
